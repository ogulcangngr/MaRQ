# The analysis modules without a browser (tests/test_cores.py): synthetic channels of known
# shape, and the recorded numbers of the test channel and its copy, with the Python, NumPy and
# SciPy versions of MaRQ's runtime (Pyodide 314.0.7), so a change of any result shows here.
name: Analysis check

on:
  workflow_dispatch:
  push:
    branches: [main, ci-launchers]
    tags-ignore: ["**"]
    paths:
      - "pvisual_core.py"
      - "rq_gradient_core.py"
      - "x3p_loader.py"
      - "plots.py"
      - "tests/test_cores.py"
      - "tests/test_cores_expected.json"
      - "tests/test_features_expected.json"
      - "tests/make_test_x3p.py"
      - ".github/workflows/cores.yml"

jobs:
  cores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: The versions of MaRQ's runtime
        run: pip install numpy==2.4.6 scipy==1.18.0
      - name: Tests of the analysis modules
        run: python tests/test_cores.py
