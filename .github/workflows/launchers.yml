# Starts MaRQ with its bundled launcher on Windows, macOS (Apple silicon, Intel) and Linux,
# as a user would, and analyses a synthetic channel in real browsers with the internet
# blocked. Run by hand (Actions tab, "Run workflow") or on changes to the launchers.
name: Launcher check

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - "launchers/**"
      - "MaRQ.*"
      - "run_marq.py"
      - "index.html"
      - "app.js"
      - "worker.js"
      - "tests/**"
      - ".github/workflows/launchers.yml"

jobs:
  start:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, start: "./MaRQ.exe", browsers: "chromium firefox" }
          - { os: macos-15, start: "sh MaRQ.command", browsers: "chromium webkit" }
          - { os: macos-15-intel, start: "sh MaRQ.command", browsers: "chromium webkit" }
          - { os: ubuntu-latest, start: "sh MaRQ.sh", browsers: "chromium firefox" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test tools (Playwright browsers)
        run: |
          pip install playwright numpy
          python -m playwright install --with-deps ${{ matrix.browsers }}
      - name: Mark the files as downloaded from the internet (macOS quarantine)
        if: runner.os == 'macOS'
        run: xattr -w com.apple.quarantine "0081;00000000;Safari;" MaRQ.command launchers/*
      - name: Start MaRQ with its launcher
        env:
          MARQ_NO_BROWSER: "1"
        run: |
          ${{ matrix.start }} > launcher.log 2>&1 &
          for i in $(seq 1 30); do grep -q "running at" launcher.log && break; sleep 1; done
          cat launcher.log
          # the bundled launcher, not the Python fallback, must have started
          grep -q "the Microchannel and Replication Quality Analyzer" launcher.log
          echo "URL=$(grep -o 'http://127.0.0.1:[0-9]*/' launcher.log | head -1)" >> "$GITHUB_ENV"
      - name: Content types
        run: |
          curl -sI "${URL}worker.js" | tee /dev/stderr | grep -qi "content-type: text/javascript"
          curl -sI "${URL}vendor/pyodide/pyodide.asm.wasm" | grep -qi "content-type: application/wasm"
      - name: Analyse a synthetic channel in the browsers, offline
        run: for b in ${{ matrix.browsers }}; do python tests/e2e_synthetic.py "$URL" --browser "$b" || exit 1; done
