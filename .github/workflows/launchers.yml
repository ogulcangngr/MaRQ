# Starts MaRQ with its bundled launcher on Windows, macOS (Apple silicon, Intel) and Linux,
# as a user would, analyses a synthetic channel in real browsers with the internet blocked,
# goes through the interface (comparison, maps, cross-sections, 3D, report, language,
# sessions), and checks that the launchers, the Python one included, keep one MaRQ per folder
# and stop when the last window closes. Run by hand (Actions tab, "Run workflow") or on
# changes to the application.
name: Launcher check

on:
  workflow_dispatch:
  push:
    branches: [main, ci-launchers]
    tags-ignore: ["**"]
    paths:
      - "launcher/**"
      - "launchers/**"
      - "MaRQ.*"
      - "run_marq.py"
      - "index.html"
      - "app.js"
      - "worker.js"
      - "viewer3d.js"
      - "style.css"
      - "plots.py"
      - "i18n.js"
      - "tests/**"
      - ".github/workflows/launchers.yml"

jobs:
  start:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, start: "./MaRQ.exe", browsers: "chromium firefox" }
          - { os: macos-15, start: "sh MaRQ.command", browsers: "chromium webkit" }
          - { os: macos-15-intel, start: "sh MaRQ.command", browsers: "chromium webkit" }
          - { os: ubuntu-latest, start: "sh MaRQ.sh", browsers: "chromium firefox" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45                  # a hung step (one browser download stalled for hours) ends here
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test tools (Playwright browsers)
        run: |
          pip install playwright numpy
          python -m playwright install --with-deps ${{ matrix.browsers }}
      - name: Mark the files as downloaded from the internet (macOS quarantine)
        if: runner.os == 'macOS'
        run: xattr -w com.apple.quarantine "0081;00000000;Safari;" MaRQ.command launchers/*
      - name: Start MaRQ with its launcher
        env:
          MARQ_NO_BROWSER: "1"
        run: |
          ${{ matrix.start }} > launcher.log 2>&1 &
          for i in $(seq 1 30); do grep -q "running at" launcher.log && break; sleep 1; done
          cat launcher.log
          # the bundled launcher, not the Python fallback, must have started
          grep -q "the Microchannel and Replication Quality Analyzer" launcher.log
          echo "URL=$(grep -o 'http://127.0.0.1:[0-9]*/' launcher.log | head -1)" >> "$GITHUB_ENV"
      - name: Content types
        run: |
          h=$(curl -sI "${URL}worker.js"); echo "$h"; echo "$h" | grep -qi "content-type: text/javascript"
          curl -sI "${URL}vendor/pyodide/pyodide.asm.wasm" | grep -qi "content-type: application/wasm"
      - name: Analyse a synthetic channel in the browsers, offline
        run: for b in ${{ matrix.browsers }}; do python tests/e2e_synthetic.py "$URL" --browser "$b" || exit 1; done
      - name: The interface in the browsers, offline
        run: for b in ${{ matrix.browsers }}; do python tests/e2e_features.py "$URL" --browser "$b" || exit 1; done
      - name: "Launcher: one MaRQ per folder, stops when its last window closes"
        run: python tests/launcher_check.py ${{ matrix.start }}
      - name: "Python launcher: the same"
        run: python tests/launcher_check.py --python
